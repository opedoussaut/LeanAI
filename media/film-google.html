<!doctype html>
<html><head><meta charset="utf-8"><title>LeanAI · Value first, built on Google's agentic stack — film</title>
<style>
@font-face { font-family: Inter; font-weight: 300; src: url(inter-latin-300-normal.woff2); }
@font-face { font-family: Inter; font-weight: 400; src: url(inter-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(inter-latin-600-normal.woff2); }
@font-face { font-family: Inter; font-weight: 700; src: url(inter-latin-700-normal.woff2); }
@font-face { font-family: Inter; font-weight: 800; src: url(inter-latin-800-normal.woff2); }
html, body { margin: 0; background: #eef1f5; height: 100%; }
body { display: grid; place-items: center; }
canvas { display: block; width: min(100vw, 177.78vh); height: auto; }
#bar { position: fixed; left: 0; bottom: 0; height: 3px; background: #2f5bea; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><div id="bar"></div>
<script type="module">
// LeanAI · Industrial Recovery — "Value first. Built on Google's agentic stack." (1920×1080, 80 s). Deterministic render(t).
// Figures: railStory() → googleFilmFacts(), the same source as the page. Google-stack artifacts: evidence/google/stack.json
// (the real MCP tool list and the real A2A agent cards served by Google ADK) and the real LlmAgent definition read from
// src/providers/gemini-adk.mjs. Nothing numeric is typed in. NovaRail is fictional; no third-party logos are drawn.
import { railStory } from '../src/scenarios/rail/facts.js';
import { googleFilmFacts, GOOGLE_SCENES as SC, GOOGLE_DURATION as DURATION } from '../src/scenarios/rail/film.js';

const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = k => 1 - Math.pow(1 - k, 3);
const fade = (t, a, b, c, d) => Math.min(eio(seg(t, a, b)), 1 - eio(seg(t, c, d)));
const K = { bg: [244, 246, 249], ink: [13, 23, 38], sub: [91, 107, 128], line: [221, 227, 235], blue: [47, 91, 234], violet: [122, 79, 240], teal: [8, 143, 138], green: [11, 138, 85], amber: [201, 122, 16], red: [212, 60, 60], white: [255, 255, 255], code: [24, 31, 44] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const MONO = '"DejaVu Sans Mono", "SF Mono", Menlo, Consolas, monospace';
function text(s, x, y, { size = 48, weight = 600, color = K.ink, a = 1, align = 'center', track = 0, font = 'Inter' } = {}) {
  if (a <= .003) return; g.font = `${weight} ${size}px ${font === 'mono' ? MONO : 'Inter'}`; g.textAlign = align; g.textBaseline = 'middle'; g.letterSpacing = `${track}px`; g.fillStyle = rgba(color, Math.min(1, a)); g.fillText(s, x, y); g.letterSpacing = '0px';
}
const tw = (s, size, weight, font) => { g.font = `${weight} ${size}px ${font === 'mono' ? MONO : 'Inter'}`; return g.measureText(s).width; };
function line(x1, y1, x2, y2, c, a, w = 1.5, dash) { if (a <= .003) return; g.strokeStyle = rgba(c, a); g.lineWidth = w; g.setLineDash(dash ?? []); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.setLineDash([]); }
function card(x, y, w, h, a, { r = 18, fill = K.white, stroke = K.line, lw = 1.5, shadow = true } = {}) {
  if (a <= .003) return; g.save(); g.globalAlpha = a;
  if (shadow) { g.shadowColor = 'rgba(16,32,60,.10)'; g.shadowBlur = 30; g.shadowOffsetY = 10; }
  g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = rgba(fill, 1); g.fill(); g.shadowColor = 'transparent';
  if (stroke) { g.strokeStyle = rgba(stroke, 1); g.lineWidth = lw; g.stroke(); }
  g.restore();
}
function pill(s, x, y, col, a, { size = 18, filled = false } = {}) { const w = tw(s, size, 700) + 34; card(x - w / 2, y - 20, w, 40, a, { r: 20, fill: filled ? col : K.white, stroke: col, shadow: false }); text(s, x, y + 1, { size, weight: 700, color: filled ? K.white : col, a }); return w; }
function bg(t) {
  g.fillStyle = rgba(K.bg, 1); g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(13,23,38,.035)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 48) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}
function chapter(label, T, a, b, c, d, col = K.blue) { const k = fade(T, a, b, c, d); g.fillStyle = rgba(col, k); g.fillRect(120, 96, 6, 30); text(label, 142, 112, { size: 20, weight: 700, color: col, a: k, align: 'left', track: 1 }); }
function headline(s, T, a, b, c, d, y = 200, size = 64, color = K.ink, weight = 800) { const k = fade(T, a, b, c, d); text(s, 120, y + (1 - eout(seg(T, a, b))) * 20, { size, weight, color, a: k, align: 'left', track: -1.5 }); }
function codeBlock(lines, x, y, w, a, typed = 1) {
  const lh = 40, h = lines.length * lh + 56; card(x, y, w, h, a, { fill: K.code, stroke: null });
  const total = lines.join('\n').length; let shown = Math.floor(total * typed);
  lines.forEach((l, i) => { const s = l.slice(0, Math.max(0, shown)); shown -= l.length + 1; text(s, x + 30, y + 46 + i * lh, { size: 22, weight: 400, color: [214, 224, 240], a, align: 'left', font: 'mono' }); });
}

// ---------- data ----------
const story = await railStory();
const stack = await (await fetch('../evidence/google/stack.json')).json();
const F = googleFilmFacts(story, stack);
const src = await (await fetch('../src/providers/gemini-adk.mjs')).text();
const adkLines = src.slice(src.indexOf('const agent = new LlmAgent({'), src.indexOf('afterModelCallback')).trim().split('\n').map(l => l.trim()).filter(Boolean);
const CODE = [adkLines[0], ...adkLines.slice(1).flatMap(l => l.length > 74 ? l.split(/(?<=,) /).map((p, i) => (i ? '  ' : '  ') + p) : ['  ' + l]), '});'];
const SYS_COL = { ERP: K.blue, MES: K.violet, Inventory: K.teal, Planning: K.amber, Configuration: K.red, 'Cost/Risk': K.green };

// ---------- scenes ----------
function open(T) {
  bg(T);
  headline('Every AI project should start', T, .3, 1.1, 6.3, 6.9, 330, 78);
  headline('with a business case.', T, .6, 1.4, 6.3, 6.9, 420, 78, K.blue);
  headline('Not with a model.', T, 1.8, 2.6, 6.3, 6.9, 520, 78, K.sub, 300);
  const k = fade(T, 3, 3.8, 6.3, 6.9);
  card(1180, 650, 620, 230, k);
  text(`Supplier notice ${F.notice.id}`, 1210, 690, { size: 20, weight: 600, color: K.sub, a: k, align: 'left' });
  text(F.notice.delay, 1210, 750, { size: 54, weight: 800, color: K.red, a: k, align: 'left', track: -1 });
  text(F.notice.line, 1210, 805, { size: 22, weight: 500, a: k, align: 'left' });
  text(`Pegged to ${F.notice.affected}`, 1210, 845, { size: 20, weight: 400, color: K.sub, a: k, align: 'left' });
}
function gate(T) {
  bg(T);
  chapter('Value gate', T, .2, .8, 9.3, 10);
  headline('Value at stake decides whether AI runs.', T, .3, 1.1, 9.3, 10, 200, 60);
  const cols = [{ x: 140, title: 'Same morning · routine notice', line: F.routine.line, stake: F.routine.atStake, verdict: 'Deterministic rules', sub: `No agent, no model call · AI cost ${F.routine.aiCost}`, col: K.sub, t0: 1.4 },
                { x: 1000, title: `Notice ${F.notice.id}`, line: F.notice.delay + ' · 3 trainsets', stake: F.main.atStake, verdict: 'Agentic reasoning required', sub: F.main.model, col: K.blue, t0: 3 }];
  for (const c of cols) {
    const k = fade(T, c.t0, c.t0 + .7, 9.3, 10);
    card(c.x, 320, 780, 560, k);
    text(c.title, c.x + 40, 370, { size: 22, weight: 600, color: K.sub, a: k, align: 'left' });
    text(c.line, c.x + 40, 415, { size: 28, weight: 600, a: k, align: 'left' });
    text('At stake if nothing is done', c.x + 40, 500, { size: 20, weight: 500, color: K.sub, a: k * seg(T, c.t0 + .6, c.t0 + 1.2), align: 'left' });
    text(c.stake, c.x + 40, 580, { size: 104, weight: 800, color: c.col === K.blue ? K.ink : K.sub, a: k * seg(T, c.t0 + .8, c.t0 + 1.4), align: 'left', track: -3 });
    line(c.x + 40, 660, c.x + 740, 660, K.line, k, 1.5);
    const kv = k * seg(T, c.t0 + 1.6, c.t0 + 2.2);
    text(c.verdict, c.x + 40, 715, { size: 40, weight: 800, color: c.col, a: kv, align: 'left' });
    text(c.sub, c.x + 40, 770, { size: 21, weight: 400, color: K.sub, a: kv, align: 'left' });
  }
  text('Computed by deterministic code before any model is involved.', W / 2, 960, { size: 24, weight: 400, color: K.sub, a: fade(T, 6.6, 7.2, 9.3, 10) });
}
function ground(T) {
  bg(T);
  chapter('Grounding', T, .2, .7, 4.4, 5, K.teal);
  const k = fade(T, .3, .9, 4.4, 5);
  text(F.ground.raw, 520, 500, { size: 150, weight: 800, color: K.sub, a: k * (1 - seg(T, 2, 2.6) * .5), track: -5 });
  text('enterprise records', 520, 610, { size: 26, weight: 500, color: K.sub, a: k });
  const ka = seg(T, 1.2, 2);
  line(820, 500, lerp(820, 1080, ka), 500, K.teal, k, 4); if (ka > .98) { g.fillStyle = rgba(K.teal, k); g.beginPath(); g.moveTo(1092, 500); g.lineTo(1072, 488); g.lineTo(1072, 512); g.fill(); }
  text(F.ground.evidence, 1390, 500, { size: 150, weight: 800, color: K.teal, a: k * seg(T, 1.8, 2.4), track: -5 });
  text('facts with their source', 1390, 610, { size: 26, weight: 500, color: K.teal, a: k * seg(T, 1.8, 2.4) });
  text(`Gemini never sees the raw ERP — ${F.ground.pct} less context.`, W / 2, 790, { size: 36, weight: 700, a: fade(T, 2.6, 3.2, 4.4, 5) });
}
function adk(T) {
  bg(T);
  chapter('Google Agent Development Kit', T, .2, .8, 6.3, 7);
  headline('Four specialists, defined in code with ADK.', T, .3, 1.1, 6.3, 7, 200, 56);
  codeBlock(CODE, 120, 300, 1020, fade(T, .8, 1.4, 6.3, 7), eio(seg(T, 1, 4.2)));
  F.agents.forEach((a, i) => { const k = fade(T, 1.6 + i * .5, 2.2 + i * .5, 6.3, 7), y = 300 + i * 132; card(1220, y, 580, 112, k); text(a.name, 1250, y + 40, { size: 26, weight: 700, color: K.blue, a: k, align: 'left', font: 'mono' }); text(`Gemini · ${a.tools.length} MCP tools`, 1250, y + 80, { size: 20, weight: 500, color: K.sub, a: k, align: 'left' }); });
  text(`@google/adk ${F.packages['@google/adk']} · model ${F.model}`, 120, 920, { size: 20, weight: 500, color: K.sub, a: fade(T, 4.4, 5, 6.3, 7), align: 'left' });
}
function a2a(T) {
  bg(T);
  chapter('A2A · agent to agent', T, .2, .8, 7.3, 8, K.violet);
  headline('Each specialist publishes an agent card.', T, .3, 1.1, 7.3, 8, 200, 56);
  const hub = [360, 600];
  const kh = fade(T, .8, 1.4, 7.3, 8);
  card(hub[0] - 170, hub[1] - 60, 340, 120, kh, { stroke: K.ink, lw: 2 });
  text('LeanAI orchestrator', hub[0], hub[1] - 12, { size: 26, weight: 800, a: kh }); text('deterministic code', hub[0], hub[1] + 26, { size: 19, weight: 500, color: K.sub, a: kh });
  F.agents.forEach((a, i) => {
    const k = fade(T, 1.2 + i * .45, 1.8 + i * .45, 7.3, 8), x = 760, y = 290 + i * 160, w = 1040, h = 132;
    const p = eio(seg(T, 1.4 + i * .45, 2.2 + i * .45));
    line(hub[0] + 170, hub[1], lerp(hub[0] + 170, x, p), lerp(hub[1], y + h / 2, p), K.violet, .7 * k, 2.5);
    const dot = (T * .5 + i * .25) % 1; g.fillStyle = rgba(K.violet, k * seg(T, 3, 3.6)); g.beginPath(); g.arc(lerp(hub[0] + 170, x, dot), lerp(hub[1], y + h / 2, dot), 7, 0, 6.283); g.fill();
    card(x, y, w, h, k);
    text(`"name": "${a.name}"`, x + 30, y + 36, { size: 22, weight: 600, color: K.violet, a: k, align: 'left', font: 'mono' });
    text(`"protocolVersion": "${a.protocol}"   "preferredTransport": "${a.transport}"`, x + 30, y + 72, { size: 19, weight: 400, color: K.sub, a: k, align: 'left', font: 'mono' });
    text(`skills: ${a.tools.join(', ')}`, x + 30, y + 106, { size: 19, weight: 400, color: K.ink, a: k, align: 'left', font: 'mono' });
  });
  text('Served by ADK toA2a · reached with the official A2A client · real cards recorded from the running agents', 120, 960, { size: 20, weight: 500, color: K.sub, a: fade(T, 4, 4.6, 7.3, 8), align: 'left' });
}
function mcp(T) {
  bg(T);
  chapter('MCP · agent to enterprise system', T, .2, .8, 7.3, 8, K.teal);
  headline('Facts come from systems, through MCP.', T, .3, 1.1, 7.3, 8, 200, 56);
  const systems = [...new Set(F.tools.map(t => t.system))];
  systems.forEach((sname, i) => {
    const k = fade(T, .8 + i * .25, 1.4 + i * .25, 7.3, 8), x = 120 + (i % 3) * 300, y = 300 + Math.floor(i / 3) * 250, col = SYS_COL[sname] ?? K.teal;
    card(x, y, 270, 210, k);
    text(sname, x + 24, y + 40, { size: 24, weight: 800, color: col, a: k, align: 'left' });
    F.tools.filter(t => t.system === sname).forEach((t, j) => text(t.name, x + 24, y + 90 + j * 36, { size: 19, weight: 400, a: k, align: 'left', font: 'mono' }));
  });
  // a real call and its real answer
  const kc = fade(T, 3, 3.6, 7.3, 8), s = F.sample;
  codeBlock([`→ tools/call ${s.tool}`, `  ${JSON.stringify(s.arguments)}`, `← status: "${s.structuredContent.status}"`, `  baseline: "${s.structuredContent.baseline}"`], 1060, 300, 740, kc, eio(seg(T, 3.2, 5.4)));
  text('Read-only tools · typed inputs · the same server every agent uses', 1060, 620, { size: 21, weight: 500, color: K.sub, a: kc, align: 'left' });
  text(`@modelcontextprotocol/sdk ${F.packages['@modelcontextprotocol/sdk']} · ${F.tools.length} tools`, 1060, 660, { size: 20, weight: 500, color: K.sub, a: kc, align: 'left' });
}
function contract(T) {
  bg(T);
  chapter('Gemini, under contract', T, .2, .8, 6.3, 7);
  headline('Gemini returns JSON. Code checks it.', T, .3, 1.1, 6.3, 7, 200, 56);
  const steps = [['Gemini proposes', 'structured JSON|per specialist', K.blue], ['Contract check', 'required keys and types|or the run stops', K.ink], ['Deterministic validation', 'stock, dates, capacity,|configuration', K.teal], ['Usage measured', 'tokens from usageMetadata|→ € per decision', K.green]];
  steps.forEach(([a, b, col], i) => { const k = fade(T, .8 + i * .6, 1.4 + i * .6, 6.3, 7), x = 120 + i * 435; card(x, 340, 405, 220, k); g.fillStyle = rgba(col, k); g.fillRect(x, 340, 6, 220); text(a, x + 34, 410, { size: a.length > 20 ? 27 : 30, weight: 800, color: col, a: k, align: 'left' }); b.split('|').forEach((l, j) => text(l, x + 34, 468 + j * 32, { size: 21, weight: 400, color: K.sub, a: k, align: 'left' })); });
  text('Models are replaceable.', 120, 700, { size: 52, weight: 300, a: fade(T, 3.6, 4.2, 6.3, 7), align: 'left' });
  text('The business architecture is not.', 120, 770, { size: 52, weight: 800, a: fade(T, 4.1, 4.7, 6.3, 7), align: 'left' });
  text(`This run: ${F.ai.calls} model turns · ${F.ai.tools} MCP calls · ${F.ai.messages} A2A messages${F.ai.estimated ? ' · deterministic replay, tokens estimated' : ''}`, 120, 900, { size: 21, weight: 500, color: K.sub, a: fade(T, 4.6, 5.2, 6.3, 7), align: 'left' });
}
function outcome(T) {
  bg(T);
  chapter('Business outcome', T, .2, .8, 9.3, 10, K.green);
  headline('Delivery commitment protected.', T, .3, 1.1, 9.3, 10, 200, 60);
  F.plan.forEach((p, i) => { const k = fade(T, .8 + i * .3, 1.4 + i * .3, 9.3, 10), x = 120 + i * 300; card(x, 300, 270, 96, k); text(p.trainset, x + 24, 335, { size: 26, weight: 800, a: k, align: 'left' }); text({ CONTINUE: 'continue', ALLOCATE_STOCK: 'existing stock', RESEQUENCE_AND_SLACK: 'resequence + slack' }[p.kind], x + 24, 370, { size: 19, weight: 500, color: K.green, a: k, align: 'left' }); });
  const kv = fade(T, 2, 2.8, 9.3, 10);
  text(F.values.protected, 120, 560, { size: 170, weight: 800, color: K.green, a: kv, align: 'left', track: -6 });
  text('value protected by the proposed recovery', 130, 670, { size: 26, weight: 600, color: K.green, a: kv, align: 'left' });
  text(`exposure ${F.values.exposure} − recovery ${F.values.cost} − residual ${F.values.residual}`, 130, 715, { size: 22, weight: 400, color: K.sub, a: kv, align: 'left' });
  const ka = fade(T, 4, 4.8, 9.3, 10);
  card(1180, 470, 620, 300, ka);
  text('AI cost of the decision', 1215, 520, { size: 22, weight: 600, color: K.sub, a: ka, align: 'left' });
  text(F.ai.cost, 1215, 600, { size: 90, weight: 800, a: ka, align: 'left', track: -3 });
  text(`≈ ${F.perEuro} € protected per € of AI`, 1215, 680, { size: 26, weight: 700, color: K.blue, a: ka * seg(T, 5, 5.6), align: 'left' });
  text(F.ai.estimated ? 'estimated tokens × Flash-tier list price' : 'measured tokens × list price', 1215, 725, { size: 18, weight: 400, color: K.sub, a: ka, align: 'left' });
  text('The value comes from the plan people approve — not from the AI.', 120, 900, { size: 28, weight: 600, a: fade(T, 6.2, 6.9, 9.3, 10), align: 'left' });
}
function twist(T) {
  bg(T);
  const k = fade(T, .2, .8, 8.3, 9);
  card(120, 170, 1680, 300, k, { stroke: K.red, lw: 3 });
  text('Configuration conflict', 170, 250, { size: 64, weight: 800, color: K.red, a: k, align: 'left', track: -1 });
  if (F.conflict) text(`The stock found for ${F.conflict.trainset} is validated for another configuration — caught by the MCP tool checkConfiguration.`, 170, 330, { size: 26, weight: 500, a: k, align: 'left' });
  text('Agents stop. They cannot authorise a deviation.', 170, 400, { size: 26, weight: 400, color: K.sub, a: k, align: 'left' });
  const st = [['Gemini proposed', K.blue], ['Engineering review', K.red], ['Engineering validated', K.teal], ['Human approved', K.ink]];
  st.forEach(([s, col], i) => { const kk = fade(T, 1.8 + i * .7, 2.4 + i * .7, 8.3, 9), x = 120 + i * 435; card(x, 560, 405, 110, kk, { stroke: col, lw: 2 }); text(s, x + 202, 615, { size: 30, weight: 800, color: col, a: kk }); if (i < 3) line(x + 410, 615, x + 430, 615, K.sub, kk, 2); });
  text('Gemini proposes. Engineering validates. Humans decide.', W / 2, 820, { size: 44, weight: 800, a: fade(T, 5, 5.7, 8.3, 9) });
}
function end(T) {
  bg(T);
  text('Value first.', W / 2, 330, { size: 92, weight: 800, a: eout(seg(T, .3, 1.2)), track: -3 });
  text('AI where it pays.', W / 2, 440, { size: 92, weight: 800, color: K.blue, a: eout(seg(T, 1, 1.9)), track: -3 });
  text('Engineering always.', W / 2, 550, { size: 92, weight: 300, color: K.sub, a: eout(seg(T, 1.7, 2.6)), track: -3 });
  const k = seg(T, 3, 3.8);
  ['Gemini', 'Agent Development Kit', 'A2A', 'MCP'].forEach((s, i, arr) => { const ws = arr.map(x => tw(x, 22, 700) + 34), tot = ws.reduce((a, b) => a + b, 0) + 24 * 3; let x = W / 2 - tot / 2; for (let j = 0; j < i; j++) x += ws[j] + 24; pill(s, x + ws[i] / 2, 700, [K.blue, K.blue, K.violet, K.teal][i], k, { size: 22 }); });
  text('Built on Google’s agentic stack', W / 2, 760, { size: 22, weight: 500, color: K.sub, a: k });
  const k2 = seg(T, 4.4, 5.2);
  text('LeanAI · Industrial Recovery', W / 2, 870, { size: 34, weight: 800, a: k2 });
  text('Fictional manufacturer · synthetic data · simulated enterprise systems · agent run replayed deterministically', W / 2, 1010, { size: 17, weight: 400, color: K.sub, a: k2 });
}

function render(t) {
  g.globalAlpha = 1;
  const order = Object.entries(SC).sort((a, b) => a[1] - b[1]);
  let cur = order[0];
  for (const o of order) if (t >= o[1]) cur = o;
  const T = t - cur[1];
  ({ open, gate, ground, adk, a2a, mcp, contract, outcome, twist, end })[cur[0]](T);
  const fo = seg(t, DURATION - 1.2, DURATION), fi = 1 - seg(t, 0, .5);
  if (fo + fi > 0) { g.fillStyle = `rgba(244,246,249,${Math.max(fo, fi)})`; g.fillRect(0, 0, W, H); }
}
for (const w of [300, 400, 600, 700, 800]) await document.fonts.load(`${w} 40px Inter`);
window.render = render; window.DURATION = DURATION; window.SCENES = SC; window.FILM_FACTS = F; window.ready = true;
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now(), bar = document.getElementById('bar');
  const loop = () => { const t = ((performance.now() - t0) / 1000) % DURATION; render(t); bar.style.width = `${t / DURATION * 100}%`; requestAnimationFrame(loop); };
  loop();
} else render(0);
</script></body></html>
