const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

function chapter(label, T, a, b, c, d, col = K.blue) { const k = fade(T, a, b, c, d); g.fillStyle = rgba(col, k); g.fillRect(120, 96, 6, 30); text(label, 142, 112, { size: 20, weight: 700, color: col, a: k, align: 'left', track: 1 }); }

// ---------- data ----------

function gate(T) {

function why(T) {
